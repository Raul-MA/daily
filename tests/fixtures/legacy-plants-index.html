<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mis Plantas</title>

  <!-- PWA meta tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B9E7A">
  <meta name="description" content="Lleva el registro del cuidado de tus plantas, sin conexión.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mis Plantas">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">

  <!-- Styles: global first, then feature overrides -->
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./dashboard/dashboard.css">
  <link rel="stylesheet" href="./plants/plants.css">
  <link rel="stylesheet" href="./care/care.css">
  <link rel="stylesheet" href="./settings/settings.css">
</head>
<body>
  <div id="app">

    <!-- Mobile header -->
    <header id="app-header">
      <button id="back-btn" class="icon-btn" aria-label="Volver" hidden>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="13,4 7,10 13,16"/>
        </svg>
      </button>
      <span id="app-title" aria-live="polite">Mis Plantas</span>
      <span class="reminder-count header-reminder-count" data-reminder-count hidden></span>
      <button id="install-btn" class="btn btn-sm btn-primary" hidden aria-label="Instalar app">
        Instalar
      </button>
    </header>

    <!-- Dynamic view -->
    <main id="app-main" role="main" aria-label="Contenido principal">
      <!-- Content rendered by app.js -->
    </main>

    <!-- Navigation -->
    <nav id="app-nav" aria-label="Navegación principal">
      <button class="nav-btn active" data-route="dashboard" aria-label="Inicio">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="7" height="7" rx="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Inicio</span>
        <span class="reminder-count nav-reminder-count" data-reminder-count hidden></span>
      </button>

      <button class="nav-btn" data-route="add-plant" aria-label="Agregar planta">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="10" cy="10" r="8"/>
          <line x1="10" y1="6" x2="10" y2="14"/>
          <line x1="6" y1="10" x2="14" y2="10"/>
        </svg>
        <span>Agregar</span>
      </button>

      <button class="nav-btn" data-route="settings" aria-label="Ajustes">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="10" r="2.5"/>
          <path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2
                   M4.1 4.1l1.42 1.42M14.48 14.48l1.42 1.42
                   M4.1 15.9l1.42-1.42M14.48 5.52l1.42-1.42"/>
        </svg>
        <span>Ajustes</span>
      </button>
    </nav>

  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
